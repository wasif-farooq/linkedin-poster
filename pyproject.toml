[project]
name = "linkedin-poster"
version = "0.1.0"
description = "Manager-led multi-agent LangGraph app that finds, researches, writes and publishes LinkedIn posts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "trafilatura>=2.2.0",
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
linkedin-poster = "app.main:app"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # long lines are handled by `ruff format`
    "B008",  # typer.Option(...) defaults are the standard Typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
